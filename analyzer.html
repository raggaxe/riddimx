<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f13" />
    <title>RiddimX · Analisador BPM</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #0d0f13;
        color: #e8eaf0;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      p {
        margin: 6px 0;
        color: #8b93a5;
      }
      button {
        width: 100%;
        height: 44px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #4cd97b;
        background: #4cd97b;
        color: #0b0d11;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      button:active {
        transform: scale(0.97);
      }
      button[hidden] {
        display: none;
      }
      #status {
        color: #e8eaf0;
        font-weight: 600;
      }
      #status.error {
        color: #ff6b6b;
      }
      #player {
        width: 100%;
        aspect-ratio: 16 / 9;
        margin: 10px 0;
        border-radius: 6px;
        overflow: hidden;
        background: #000;
      }
      #player iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      ol {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #8b93a5;
      }
      li {
        padding: 3px 0;
        border-top: 1px solid #2a2f3a;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1>Analisador BPM</h1>
    <p id="status">Clica em Ativar para começar.</p>
    <button id="start">Ativar análise</button>
    <p id="help">
      O browser vai pedir para partilhar <b>este separador</b>: aceita e mantém o áudio ativo. Os clipes tocam aqui em
      silêncio, a 2x, só para medir o BPM. Deixa esta janela aberta (pode ficar atrás da app).
    </p>
    <div id="player"></div>
    <ol id="log"></ol>
    <script type="module" src="/src/analyzer.ts"></script>
  </body>
</html>
