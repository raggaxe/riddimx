<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>RiddimX LIVE</title>
<style>
  :root { --bg: #0e0d0a; --panel: #161410; --line: #2c281f; --text: #ece6d8; --dim: #958c7a; --on: #f2c230; --hot: #e5484d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: grid; place-items: center; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  main { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); padding: 24px 20px; display: grid; gap: 18px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: 0.02em; display: flex; align-items: center; gap: 10px; }
  h1 small { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: var(--dim); border: 1px solid var(--line); padding: 2px 6px; }
  h1 small.on { color: #1a1608; background: var(--on); border-color: var(--on); }
  #now { min-height: 2.8em; color: var(--dim); font-size: 13px; }
  #now b { display: block; color: var(--text); font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; font-weight: 800; letter-spacing: 0.1em; border-radius: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #play { height: 64px; width: 100%; border: 1px solid var(--line); background: #1e1b15; color: var(--text); font-size: 16px; transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1); }
  #play:active { transform: scale(0.97); }
  #play.on { background: var(--on); border-color: var(--on); color: #1a1608; }
  .row { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 12px; }
  input[type=range] { flex: 1; accent-color: var(--on); }
  #status { font-size: 12px; color: var(--dim); min-height: 1.4em; }
  #status.err { color: #ff8a7a; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; }
  .dot.on { background: var(--hot); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .dot.on { animation: none; } }
  footer { font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1><span class="dot" id="dot"></span>RiddimX <small id="badge">LIVE</small></h1>
  <div id="now">Live mix, straight from the DJ's decks.</div>
  <button id="play" type="button">LISTEN</button>
  <div class="row"><span>VOL</span><input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <footer><span id="count"></span></footer>
</main>
<audio id="out" playsinline></audio>
<script>
(() => {
  const q = new URLSearchParams(location.search)
  const code = q.get('k')
  const $ = (id) => document.getElementById(id)
  const play = $('play'), status = $('status'), out = $('out'), dot = $('dot'), badge = $('badge')
  const ICE = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }]
  let want = false, ws = null, pc = null, retry = 0, retryTimer = 0

  const say = (text, err) => { status.textContent = text; status.classList.toggle('err', !!err) }
  if (!code) {
    play.disabled = true
    say(q.get('g') ? 'This is a co-DJ invite: open RiddimX and paste it in JOIN.' : 'This link is incomplete.', true)
    return
  }

  $('vol').addEventListener('input', (e) => { out.volume = Number(e.target.value) })

  function gathered(p) {
    if (p.iceGatheringState === 'complete') return Promise.resolve()
    return new Promise((resolve) => {
      const t = setTimeout(resolve, 2500)
      p.addEventListener('icegatheringstatechange', () => p.iceGatheringState === 'complete' && (clearTimeout(t), resolve()))
    })
  }

  // Decode the mix in stereo (WebRTC answers ask for mono unless told).
  function stereo(sdp) {
    const pt = (/a=rtpmap:(\d+) opus\/48000/i.exec(sdp) || [])[1]
    if (!pt) return sdp
    return sdp.replace(new RegExp('a=fmtp:' + pt + ' ([^\\r\\n]*)'), (m, p) => /stereo=1/.test(p) ? m : 'a=fmtp:' + pt + ' ' + p + ';stereo=1;sprop-stereo=1')
  }

  function hangUp() {
    if (pc) { pc.close(); pc = null }
    if (ws) { ws.onclose = null; ws.close(); ws = null }
    out.srcObject = null
    dot.classList.remove('on'); badge.classList.remove('on')
  }

  function again(why) {
    hangUp()
    if (!want) return
    if (retry >= 6) { want = false; setPlay(); say("Can't reach the DJ: the live set may be over.", true); return }
    say(why + ' Trying again…', true)
    clearTimeout(retryTimer)
    retryTimer = setTimeout(connect, Math.min(10000, 1000 * 2 ** retry++))
  }

  function connect() {
    if (!want) return
    say('Connecting…')
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?k=' + encodeURIComponent(code))
    ws.onopen = () => ws.send(JSON.stringify({ t: 'hello' }))
    ws.onclose = () => again('Lost the connection.')
    ws.onmessage = async (e) => {
      let m
      try { m = JSON.parse(e.data) } catch { return }
      if (m.t === 'offer' && typeof m.sdp === 'string') {
        pc?.close()
        const p = pc = new RTCPeerConnection({ iceServers: ICE })
        p.ontrack = (ev) => {
          // As little buffering as the network allows: the receiver still grows it on loss, never below this.
          try { ev.receiver.jitterBufferTarget = 0; ev.receiver.playoutDelayHint = 0 } catch (err) {}
          out.srcObject = ev.streams[0] || new MediaStream([ev.track])
          out.play().catch(() => say('Tap LISTEN again to start the sound.', true))
        }
        p.onconnectionstatechange = () => {
          if (pc !== p) return
          if (p.connectionState === 'connected') { retry = 0; say('On air.'); dot.classList.add('on'); badge.classList.add('on') }
          if (p.connectionState === 'failed') again('Your network blocked the stream.')
        }
        try {
          await p.setRemoteDescription({ type: 'offer', sdp: m.sdp })
          const answer = await p.createAnswer()
          await p.setLocalDescription({ type: 'answer', sdp: stereo(answer.sdp) })
          await gathered(p)
          ws?.send(JSON.stringify({ t: 'answer', sdp: p.localDescription.sdp }))
        } catch (err) { again('Could not start the stream.') }
      }
      if (m.t === 'now') $('now').innerHTML = m.title ? '<b></b><span></span>' : "Live mix, straight from the DJ's decks."
      if (m.t === 'now' && m.title) { $('now').querySelector('b').textContent = m.title; $('now').querySelector('span').textContent = m.artist || '' }
      if (m.t === 'count') $('count').textContent = m.n === 1 ? '1 listening' : m.n + ' listening'
      if (m.t === 'full') { want = false; hangUp(); setPlay(); say('The room is full right now. Try again in a while.', true) }
      if (m.t === 'off') { want = false; hangUp(); setPlay(); say('The DJ ended the live set.') }
    }
  }

  function setPlay() { play.textContent = want ? 'STOP' : 'LISTEN'; play.classList.toggle('on', want); play.setAttribute('aria-pressed', String(want)) }

  play.addEventListener('click', () => {
    want = !want
    setPlay()
    clearTimeout(retryTimer)
    if (want) {
      out.muted = false
      out.play().catch(() => undefined) // unlocks playback inside the tap (iPhone)
      retry = 0
      connect()
    } else { hangUp(); say('') }
  })
})()
</script>
</body>
</html>
