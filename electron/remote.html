<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RiddimX">
<meta name="theme-color" content="#0f1115">
<title>RiddimX Controller</title>
<style>
:root {
  --bg: #0f1115; --panel: #171a21; --raise: #20242d; --line: #2c313c; --text: #e9ecf1; --dim: #8a93a3;
  --a: #e5484d; --b: #4aa8ff; --c: var(--a); --red: #e5484d;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overscroll-behavior: none; }
body {
  font: 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
.top { display: flex; gap: 4px; padding: 6px 8px; align-items: center; border-bottom: 1px solid var(--line); background: var(--panel); }
.tab { flex: 1 1 0; min-width: 0; height: 34px; padding: 0 2px; border: 1px solid var(--line); background: var(--raise); border-radius: 0; font-weight: 700; font-size: 11px; letter-spacing: .03em; overflow: hidden; }
html, body { max-width: 100%; overflow-x: hidden; }
.tab.now { background: var(--c); color: #111; border-color: var(--c); }
.tab[data-p="A"] { --c: var(--a); } .tab[data-p="B"] { --c: var(--b); } .tab[data-p="mix"], .tab[data-p="dub"], .tab[data-p="fx"], .tab[data-p="mic"] { --c: #cfd5df; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); flex: none; margin: 0 4px; }
.dot.on { background: #35c46a; }
.fs { width: 34px; height: 34px; flex: none; border: 1px solid var(--line); background: var(--raise); border-radius: 0; }
.fs svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; }
main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.page { display: none; padding: 8px; gap: 8px; }
.page.now { display: grid; }
.off { position: fixed; inset: 0; display: none; place-items: center; text-align: center; background: rgba(15,17,21,.92); z-index: 9; padding: 24px; font-size: 14px; color: var(--dim); }
.off.show { display: grid; }
.off b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }

/* deck */
.deck { --c: var(--a); }
.deck.B { --c: var(--b); }
.info { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px; background: var(--panel); border-left: 3px solid var(--c); }
.info .t { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info .r { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info .bpm { grid-row: span 2; text-align: right; font: 700 22px/1 ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
.info .bpm small { display: block; font-size: 10px; color: var(--dim); font-weight: 500; margin-top: 3px; }
.prog { grid-column: 1 / -1; height: 3px; background: var(--raise); margin-top: 4px; }
.prog i { display: block; height: 100%; width: 0; background: var(--c); }
.time { color: var(--dim); font-variant-numeric: tabular-nums; }

.knobs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.knob { display: grid; justify-items: center; gap: 2px; padding: 4px 0; background: var(--panel); touch-action: none; }
.knob svg { width: 44px; height: 44px; }
.knob .trk { stroke: var(--raise); }
.knob .val { stroke: var(--c); }
.knob .cap { fill: var(--raise); stroke: var(--line); }
.knob .ptr { stroke: var(--text); stroke-width: 2; stroke-linecap: square; }
.knob span { font-size: 9px; letter-spacing: .08em; color: var(--dim); }
.knob.drag .cap { fill: #2a2f3a; }

.jogrow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
.bend { height: 64px; border: 1px solid var(--line); background: var(--raise); border-radius: 0; font-size: 20px; }
.bend.on { background: var(--c); color: #111; }
.jog { width: min(58vw, 34vh, 260px); aspect-ratio: 1; border-radius: 50%; position: relative; touch-action: none;
  background: radial-gradient(circle, #1b1e25 0 18%, #0b0c0f 19% 22%, #16181e 23% 100%);
  box-shadow: inset 0 0 0 2px var(--line), inset 0 0 0 6px #0b0c0f; }
.jog::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: repeating-radial-gradient(circle, transparent 0 3px, rgba(255,255,255,.035) 3px 4px); }
.jog .mk { position: absolute; left: 50%; top: 6%; width: 4px; height: 18%; margin-left: -2px; background: var(--c); transform-origin: 50% 245%; }
.jog .lbl { position: absolute; inset: 36%; border-radius: 50%; background: var(--c); opacity: .9; display: grid; place-items: center; color: #111; font-weight: 800; font-size: 10px; letter-spacing: .1em; }
.jog.held { box-shadow: inset 0 0 0 2px var(--c), inset 0 0 0 6px #0b0c0f; }

.fader { display: grid; grid-template-columns: 54px 1fr 54px; align-items: center; gap: 6px; }
.fader > span { font-size: 9px; letter-spacing: .08em; color: var(--dim); }
.fader > b { text-align: right; font: 600 11px ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
.slider { position: relative; height: 40px; background: var(--panel); touch-action: none; }
.slider::before { content: ""; position: absolute; left: 12px; right: 12px; top: 50%; height: 2px; margin-top: -1px; background: var(--raise); }
.slider .mid { position: absolute; left: 50%; top: 8px; bottom: 8px; width: 1px; background: var(--line); }
.slider .th { position: absolute; top: 4px; bottom: 4px; width: 24px; margin-left: -12px; background: var(--raise); border: 1px solid var(--line); border-radius: 0; }
.slider .th::after { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 2px; margin-left: -1px; background: var(--c); }
.slider.drag .th { border-color: var(--c); }
.vslider { height: 160px; width: 100%; }
.vslider::before { left: 50%; right: auto; top: 12px; bottom: 12px; width: 2px; height: auto; margin: 0 0 0 -1px; }
.vslider .th { left: 4px !important; right: 4px; width: auto; height: 22px; margin: -11px 0 0; top: auto; bottom: auto; }
.vslider .th::after { left: 4px; right: 4px; top: 50%; bottom: auto; width: auto; height: 2px; margin: -1px 0 0; }

.modes { display: grid; grid-template-columns: repeat(4, 1fr) 54px; gap: 4px; }
.mode, .shift { height: 30px; border: 1px solid var(--line); background: var(--panel); border-radius: 0; font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--dim); }
.mode.now { color: var(--c); border-color: var(--c); }
.shift.on { background: var(--text); color: #111; }
.pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.pads .pad.hat { display: none; }
.pads.five { grid-template-columns: repeat(5, 1fr); }
.pads.five .pad.hat { display: block; }
.pads.five .pad { font-size: 10px; padding: 0 2px; line-height: 1.15; white-space: normal; overflow-wrap: anywhere; }
.pad { height: 58px; border: 1px solid var(--line); background: var(--raise); border-radius: 0; font-weight: 700; font-size: 11px; letter-spacing: .04em; color: var(--dim); }
.pad.lit { border-color: var(--c); color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.pad.down, .btn.down { background: var(--c); color: #111; }
.trans { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.btn { height: 54px; border: 1px solid var(--line); background: var(--raise); border-radius: 0; font-weight: 800; font-size: 12px; letter-spacing: .06em; }
.btn.lit { color: var(--c); border-color: var(--c); }
.btn.play.lit { background: var(--c); color: #111; }
.btn svg { width: 18px; height: 18px; fill: currentColor; vertical-align: middle; }

/* mixer */
.mix { grid-template-columns: 1fr 1fr; }
.strip { display: grid; gap: 6px; padding: 6px; background: var(--panel); border-top: 3px solid var(--c); }
.strip.A { --c: var(--a); } .strip.B { --c: var(--b); }
.strip .knobs { grid-template-columns: repeat(2, 1fr); }
.strip .knob { background: var(--bg); }
.wide { grid-column: 1 / -1; }
.xf { --c: #cfd5df; display: grid; gap: 6px; padding: 8px; background: var(--panel); }
.xf .slider { height: 52px; }
.xf .slider .th { width: 34px; margin-left: -17px; }
.row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.lbl2 { font-size: 9px; letter-spacing: .08em; color: var(--dim); }
.micp .sec { --c: #6fdc95; }
.btn.play.queued { animation: queued 0.8s steps(2) infinite; }
@keyframes queued { 50% { background: var(--c); color: #111; } }
@media (prefers-reduced-motion: reduce) { .btn.play.queued { animation: none; background: var(--c); color: #111; } }
.info { position: relative; }
.libbtn { position: absolute; right: 6px; bottom: 6px; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--raise); color: var(--text); }
.libbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.info .bpm { margin-bottom: 44px; }
.libsheet { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--bg, #0b0a08); }
.libsheet[hidden] { display: none; }
.libhead { display: flex; align-items: center; gap: 8px; padding-bottom: 4px; border-bottom: 2px solid var(--c); }
.libhead b { flex: 1; font-size: 16px; }
.libx { width: 44px; height: 44px; border: 1px solid var(--line); background: var(--raise); color: var(--text); font-size: 24px; line-height: 1; }
.libq { height: 44px; padding: 0 12px; border: 1px solid var(--line); background: #0d0c0a; color: var(--text); font: inherit; font-size: 16px; }
.libmsg { font-size: 13px; color: var(--dim); min-height: 0; }
.libmsg:empty { display: none; }
.libmsg.err { color: #ff8a7a; }
.liblist { flex: 1; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 4px; }
.librow { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); text-align: left; font: inherit; }
.librow.wait { opacity: .5; }
.librow .lt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.librow .lt b, .librow .lt small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.librow .lt b { font-size: 14px; }
.librow .lt small, .librow .lm small { font-size: 12px; color: var(--dim); }
.librow .lm { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-variant-numeric: tabular-nums; }
.librow .lm b { font-size: 15px; }
.librow i { font-style: normal; font-size: 11px; font-weight: 800; padding: 2px 5px; background: var(--raise); color: var(--dim); }
.librow i.on { background: var(--c); color: #0b0a08; }
.phonemic { gap: 10px; }
.pm-status { font-size: 13px; line-height: 1.35; color: var(--text); padding: 8px 10px; border: 1px solid var(--line); background: #0d0c0a; }
.pm-status.live { background: #10291a; }
.pm-go { height: 56px; font-size: 14px; letter-spacing: .1em; }
.pm-go.on { background: #8a2b20; color: #fff; }
.pm-secure p { margin: 0 0 8px; font-size: 13px; line-height: 1.4; color: var(--text); }
.pm-link { display: grid; place-items: center; height: 48px; text-decoration: none; color: var(--text); background: #1f3a24; }

/* dub */
.dub { --c: #ff8a3d; }
.big { height: 92px; font-size: 18px; }
.preset { display: grid; grid-template-columns: 54px 1fr 54px; gap: 4px; align-items: center; }
.preset b { text-align: center; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sampler { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.sampler .pad { font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.moves { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.moves .btn { height: 44px; font-size: 10px; }

/* panels */
.fxp { grid-template-columns: 1fr; }
.slot { display: none; }
.sec { --c: #ff8a3d; display: grid; gap: 8px; padding: 8px; background: var(--panel); }
.fxp .sec, .mix .sec { --c: #7fdcff; }
.perf { position: sticky; top: -8px; z-index: 3; margin: -8px -8px 0; padding: 8px; background: var(--bg);
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; border-bottom: 1px solid var(--line); }
.perf .big { height: 76px; font-size: 15px; display: grid; place-content: center; gap: 2px; line-height: 1; }
.perf .big small { font-size: 10px; opacity: .7; }
.perf .da { --c: var(--a); } .perf .db { --c: var(--b); }
.perf .btn.lit { background: var(--c); color: #111; }
.hold { touch-action: none; }
.sec-h { all: unset; display: flex; align-items: baseline; gap: 8px; cursor: pointer; padding: 2px 0; touch-action: manipulation; }
.sec-h b { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.sec-h small { color: var(--dim); font-size: 11px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec-h i { margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--dim); border-bottom: 2px solid var(--dim); transform: rotate(45deg) translate(-2px, -2px); flex: none; }
.sec.closed .sec-h i { transform: rotate(-45deg); }
.sec.closed .sec-b { display: none; }
.sec-b { display: grid; gap: 8px; }
.opts.wrap { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); }
.opts.wrap .opt { height: 40px; font-size: 10.5px; white-space: normal; line-height: 1.1; }
.flip.do { color: var(--text); border-style: dashed; }
.sec h4 { margin: 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; display: flex; gap: 8px; align-items: baseline; }
.sec h4 small { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--dim); font-size: 11px; }
.pk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.pk .knob { background: var(--bg); }
.knob em { font-style: normal; font: 600 9px ui-monospace, Menlo, monospace; color: var(--text); font-variant-numeric: tabular-nums; min-height: 11px; }
.pr { display: grid; gap: 6px; }
.choice { display: grid; gap: 3px; }
.opts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
.opt { height: 32px; border: 1px solid var(--line); background: var(--raise); border-radius: 0; font-size: 9.5px; font-weight: 700; letter-spacing: .03em; color: var(--dim); padding: 0 3px; overflow: hidden; white-space: normal; line-height: 1.1; }
.opt.now { color: #111; background: var(--c); border-color: var(--c); }
.pf { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
.flip { height: 36px; border: 1px solid var(--line); background: var(--raise); border-radius: 0; font-size: 10px; font-weight: 700; letter-spacing: .04em; color: var(--dim); }
.flip.on { color: var(--c); border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.pf .btn { height: 44px; font-size: 11px; }

@media (orientation: landscape) and (min-width: 600px) {
  .pk { grid-template-columns: repeat(8, 1fr); }
  .opts.wrap { grid-template-columns: repeat(6, 1fr); }
  .perf .big { height: 56px; }
  .fxp.now { grid-template-columns: 1fr 1fr; }
  .page { gap: 6px; padding: 6px; }
  .deck.now { grid-template-columns: minmax(260px, 38%) 1fr; grid-template-rows: auto auto auto auto 1fr;
    grid-template-areas: "jog info" "jog knobs" "jog faders" "trans modes" "trans pads"; }
  .deck .info { grid-area: info; padding: 6px 8px; } .deck .jogrow { grid-area: jog; } .deck .knobs { grid-area: knobs; }
  .deck .faders { grid-area: faders; } .deck .modes { grid-area: modes; } .deck .pads { grid-area: pads; }
  .deck .trans { grid-area: trans; align-self: end; }
  .jog { width: min(calc(100vh - 160px), 210px); }
  .bend { height: 48px; }
  .knob svg { width: 36px; height: 36px; }
  .slider { height: 30px; }
  .pad { height: 44px; }
  .btn { height: 46px; }
  .mode, .shift { height: 26px; }
  .mix.now { grid-template-columns: 1fr 1fr 1.4fr; }
  .mix .wide { grid-column: auto; }
  .mix .sec, .dub .sec { grid-column: 1 / -1; }
  .vslider { height: 110px; }
}
</style>
</head>
<body>
<div class="top">
  <button class="tab now" data-p="A">A</button>
  <button class="tab" data-p="B">B</button>
  <button class="tab" data-p="mix">MIXER</button>
  <button class="tab" data-p="dub">DUB</button>
  <button class="tab" data-p="fx">FX</button>
  <button class="tab" data-p="mic">MIC</button>
  <i class="dot" id="dot" title="Connection"></i>
  <button class="fs" id="fs" aria-label="Full screen"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
</div>
<main id="main"></main>
<div class="off show" id="off"><div><b>Connecting to RiddimX…</b>The phone must be on the same Wi-Fi as the Mac, with the app open and Phone turned on in Settings.</div></div>

<script>
'use strict'
const KEY = new URLSearchParams(location.search).get('k') || ''
let S = null // last state from the app
let ws = null
const holdUntil = new Map() // control id → time until which the app's value is ignored (the finger is on it)
const updaters = []

// ───────── connection ─────────
let retry = 500
// From anywhere (served by the RiddimX server): phone-bridge.js gives a socket that goes through it.
const RELAY = typeof window.RxSocket === 'function'
if (RELAY) window.RxOffline = (why) => { off.querySelector('div').innerHTML = '<b>Connecting to RiddimX…</b>'; off.querySelector('div').append(why || 'The app must be open on the Mac, with Phone turned on in Settings.') }
function connect() {
  ws = RELAY ? new window.RxSocket(KEY) : new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?k=' + encodeURIComponent(KEY))
  ws.onopen = () => { retry = 500; dot.classList.add('on'); off.classList.remove('show'); ws.send(JSON.stringify({ t: 'hello' })) }
  ws.onmessage = (e) => {
    let m
    try { m = JSON.parse(e.data) } catch { return }
    if (m.t === 'rtc' || m.t === 'rtc-fail') return phoneMicAnswer(m)
    if (m.t === 'lib') return showLibrary(m.items || [])
    if (m.t === 'load') return loaded(m)
    if (m.t !== 's') return
    if (m.moves && !moves.childElementCount) buildMoves(m.moves)
    if (m.panels && !panelsBuilt) buildPanels(m.panels)
    S = m
    if (m.colors) { document.documentElement.style.setProperty('--a', m.colors.A); document.documentElement.style.setProperty('--b', m.colors.B) }
    for (const u of updaters) u(S)
  }
  ws.onclose = () => {
    dot.classList.remove('on'); off.classList.add('show')
    if (micPc) phoneMicStop(true, 'The connection to the Mac dropped. Tap USE THIS PHONE AS MIC again.')
    setTimeout(connect, retry); retry = Math.min(4000, retry * 1.6)
  }
}
const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o))
// Continuous controls: at most one message per frame per control.
const pending = new Map()
let flushing = false
function sendValue(id, v) {
  pending.set(id, v)
  holdUntil.set(id, Infinity)
  if (flushing) return
  flushing = true
  requestAnimationFrame(() => { flushing = false; for (const [id, v] of pending) send(id.startsWith('p:') ? { t: 'p', k: id.slice(2), v } : { t: 'a', id, v }); pending.clear() })
}
const release = (id) => holdUntil.set(id, performance.now() + 500)
const held = (id) => (holdUntil.get(id) || 0) > performance.now()
const buzz = () => navigator.vibrate && navigator.vibrate(8)

// ───────── little builders ─────────
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e }
const get = (path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), S)

/** A button: "button" sends 1 on press; "hold" 1 on press and 0 on release. lit(state) lights it. */
function button(label, id, { cls = 'btn', hold = false, lit } = {}) {
  const b = el('button', cls + (hold ? ' hold' : ''), label)
  const ids = () => (typeof id === 'function' ? id() : id)
  let down = false
  b.addEventListener('pointerdown', (e) => {
    e.preventDefault(); b.setPointerCapture(e.pointerId); down = true; b.classList.add('down'); buzz()
    send({ t: 'a', id: ids(), v: 1 })
  })
  const up = () => { if (!down) return; down = false; b.classList.remove('down'); if (hold) send({ t: 'a', id: ids(), v: 0 }) }
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up)
  b.addEventListener('contextmenu', (e) => e.preventDefault())
  if (lit) updaters.push((s) => b.classList.toggle('lit', !!lit(s)))
  return b
}

/** A knob: drag up / down. center: -1..1 with a detent (double tap: back to 0); else 0..1. */
function knob(label, id, path, center = true, read = null, readout = null) {
  const k = el('div', 'knob')
  k.innerHTML = '<svg viewBox="0 0 44 44"><path class="trk" d="" fill="none" stroke-width="4"/><path class="val" d="" fill="none" stroke-width="4"/>' +
    '<circle class="cap" cx="22" cy="22" r="13"/><line class="ptr" x1="22" y1="22" x2="22" y2="11"/></svg><span>' + label + '</span>' + (readout ? '<em></em>' : '')
  const [trk, val] = k.querySelectorAll('path'); const ptr = k.querySelector('line')
  const arc = (a0, a1) => {
    const p = (a) => [22 + 18 * Math.sin(a), 22 - 18 * Math.cos(a)]
    const [x0, y0] = p(a0), [x1, y1] = p(a1)
    return 'M' + x0 + ' ' + y0 + 'A18 18 0 ' + (Math.abs(a1 - a0) > Math.PI ? 1 : 0) + ' ' + (a1 > a0 ? 1 : 0) + ' ' + x1 + ' ' + y1
  }
  const SPAN = 2.4
  trk.setAttribute('d', arc(-SPAN, SPAN))
  let v = center ? 0 : 0.5
  const draw = () => {
    const unit = center ? (v + 1) / 2 : v
    const a = -SPAN + unit * 2 * SPAN
    const from = center ? 0 : -SPAN
    val.setAttribute('d', Math.abs(a - from) < 0.01 ? '' : arc(Math.min(from, a), Math.max(from, a)))
    ptr.setAttribute('transform', 'rotate(' + (a * 180 / Math.PI) + ' 22 22)')
  }
  draw()
  let y0 = 0, v0 = 0, lastTap = 0
  k.addEventListener('pointerdown', (e) => {
    k.setPointerCapture(e.pointerId); k.classList.add('drag'); y0 = e.clientY; v0 = v
    const now = performance.now()
    if (center && now - lastTap < 300) { v = 0; draw(); sendValue(id(), 0) }
    lastTap = now
  })
  k.addEventListener('pointermove', (e) => {
    if (!k.hasPointerCapture(e.pointerId)) return
    const range = center ? 2 : 1
    let next = Math.max(center ? -1 : 0, Math.min(1, v0 + ((y0 - e.clientY) / 160) * range))
    if (center && Math.abs(next) < 0.04) next = 0 // detent
    if (next !== v) { v = next; draw(); sendValue(id(), v) }
  })
  const up = () => { k.classList.remove('drag'); release(id()) }
  k.addEventListener('pointerup', up); k.addEventListener('pointercancel', up)
  const em = k.querySelector('em')
  updaters.push((s) => {
    if (em) em.textContent = readout(s) || ''
    if (held(id())) return
    const x = read ? read(s) : get(path())
    if (typeof x === 'number' && x !== v) { v = x; draw() }
  })
  return k
}

/** A fader. center: -1..1 (pitch); vertical for channel volumes. show(v) is the readout. */
function slider(id, path, { center = false, vertical = false, show } = {}) {
  const s = el('div', 'slider' + (vertical ? ' vslider' : ''))
  if (center) s.append(el('i', 'mid'))
  const th = el('i', 'th'); s.append(th)
  let v = center ? 0 : 0.5
  let out = null
  const unit = () => (center ? (v + 1) / 2 : v)
  const draw = () => {
    const u = unit()
    if (vertical) th.style.top = 12 + (1 - u) * (s.clientHeight - 24) + 'px'
    else th.style.left = 12 + u * (s.clientWidth - 24) + 'px'
    if (out && show) out.textContent = show(v)
  }
  const at = (e) => {
    const r = s.getBoundingClientRect()
    const u = vertical ? 1 - (e.clientY - r.top - 12) / (r.height - 24) : (e.clientX - r.left - 12) / (r.width - 24)
    let x = Math.max(0, Math.min(1, u))
    x = center ? x * 2 - 1 : x
    if (center && Math.abs(x) < 0.03) x = 0
    return x
  }
  // Grab the thumb anywhere: it moves relative to the finger, so touching never makes it jump.
  let start = null
  s.addEventListener('pointerdown', (e) => { s.setPointerCapture(e.pointerId); s.classList.add('drag'); start = { p: at(e), v } })
  s.addEventListener('pointermove', (e) => {
    if (!start) return
    const lo = center ? -1 : 0
    let next = Math.max(lo, Math.min(1, start.v + at(e) - start.p))
    if (center && Math.abs(next) < 0.02) next = 0
    if (next !== v) { v = next; draw(); sendValue(id(), v) }
  })
  const up = () => { start = null; s.classList.remove('drag'); release(id()) }
  s.addEventListener('pointerup', up); s.addEventListener('pointercancel', up)
  s.addEventListener('dblclick', () => { if (center) { v = 0; draw(); sendValue(id(), 0); release(id()) } })
  updaters.push(() => { if (held(id())) return; const x = get(path()); if (typeof x === 'number') { v = x; draw() } })
  new ResizeObserver(draw).observe(s)
  return { el: s, out: (o) => { out = o; draw() } }
}

function faderRow(label, id, path, opts) {
  const row = el('div', 'fader')
  const f = slider(id, path, opts)
  const b = el('b')
  row.append(el('span', '', label), f.el, b)
  f.out(b)
  return row
}

function deckPage(name) {

    knob('LOW', act('low'), at('low')), knob('FILTER', act('filter'), at('filter')), knob('FX', act('fxAmount'), at('fxAmount'), false))

  let last = null, turned = 0, spin = 0
  const angle = (e) => { const r = jog.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI }
  let acc = 0, accFlush = false
  jog.addEventListener('pointerdown', (e) => { jog.setPointerCapture(e.pointerId); last = angle(e); jog.classList.add('held'); send({ t: 'touch', d, on: true }); buzz() })
  jog.addEventListener('pointermove', (e) => {
    if (last === null) return
    const now = angle(e); let delta = now - last

    last = now; turned += delta; acc += delta
    mk.style.transform = 'rotate(' + (spin + turned) + 'deg)'
    if (!accFlush) { accFlush = true; requestAnimationFrame(() => { accFlush = false; if (acc) send({ t: 'turn', d, deg: acc, held: true }); acc = 0 }) }
  })
  const letGo = () => { if (last === null) return; last = null; jog.classList.remove('held'); send({ t: 'touch', d, on: false }) }
  jog.addEventListener('pointerup', letGo); jog.addEventListener('pointercancel', letGo); jog.addEventListener('lostpointercapture', letGo)
  // The mark turns with the music (33⅓ rpm look) while the deck plays.
  let lastT = performance.now()
  const turn = (t) => {
    const dt = (t - lastT) / 1000; lastT = t
    if (S && S[d].playing && last === null) { spin += dt * 200 * (1 + S[d].rate / 100); mk.style.transform = 'rotate(' + (spin + turned) + 'deg)' }
    requestAnimationFrame(turn)

    faderRow('VOLUME', act('volume'), at('volume'), { show: (v) => Math.round(v * 100) + '%' }),
  )

  // Pads follow the deck's mode, as on the app; SHIFT sends the second function.
  let shift = false

  for (const [m, label] of MODES) {
    const b = button(label, () => 'deck' + d + '.padMode' + m[0].toUpperCase() + m.slice(1), { cls: 'mode' })
    updaters.push((s) => b.classList.toggle('now', s[d].mode === m))
    modes.append(b)
  }
  const sh = el('button', 'shift', 'SHIFT')
  sh.addEventListener('click', () => { shift = !shift; sh.classList.toggle('on', shift); for (const u of padText) u() })
  modes.append(sh)
  const pads = el('div', 'pads')
  const padText = []
  for (let i = 0; i < 4; i++) {
    const b = button('', () => 'deck' + d + '.' + (shift ? 'padAlt' : 'pad') + (i + 1), {
      cls: 'pad',
      lit: (s) => {
        const x = s[d]
        if (x.mode === 'cue') return x.hot[i]
        if (x.mode === 'loop') return i < 2 && x.loop === [4, 8][i]
        if (x.mode === 'stems') return x.stems[[0, 1, 2, 3][i]]
        return RIDDIM[i].every((on, j) => !!x.stems[j] === !!on)
      },
    })
    const write = () => { b.textContent = PAD_LABELS[(S && S[d].mode) || 'cue'][shift ? 1 : 0][i] }
    padText.push(write)
    updaters.push(write)
    pads.append(b)
  }
  // HAT: the fifth stem, only in STEMS mode (the other modes have four pads).
  const hat = button('HAT', () => 'deck' + d + '.' + (shift ? 'stemSolo.hat' : 'stem.hat'), { cls: 'pad hat', lit: (s) => s[d].stems[4] })
  const hatText = () => { hat.textContent = shift ? 'HAT ONLY' : 'HAT' }
  padText.push(hatText)
  updaters.push(hatText)
  updaters.push((s) => pads.classList.toggle('five', s[d].mode === 'stems'))
  pads.append(hat)

  const trans = el('div', 'trans')
  const play = button(ICON.play, act('play'), { cls: 'btn play', lit: (s) => s[d].playing })
  updaters.push((s) => play.classList.toggle('queued', !!s[d].queued))
  updaters.push((s) => { const html = s[d].playing ? ICON.pause : ICON.play; if (play.innerHTML !== html) play.innerHTML = html })
  trans.append(
    button('◀◀', act('rewind')),
    button('DUB', act('dub'), { hold: true, lit: (s) => s[d].dub }),
    button('CUE', act('cue')),
    play,
    button('SYNC', act('sync'), { lit: (s) => s[d].sync }),
  )
  p.append(info, knobs, jogrow, faders, modes, pads, trans)
  return p
}

function fxPage() { const p = el('section', 'page fxp'); p.dataset.p = 'fx'; return p }
let panelsBuilt = false
const pv = (s, k) => s.panel && s.panel.v[k]
function buildPanels(panels) {
  panelsBuilt = true
  for (const [page, sections] of Object.entries(panels)) {
    const host = main.querySelector('.page[data-p="' + page + '"]')
    if (!host) continue
    for (const sec of sections) {
      const box = el('div', 'sec wide')
      const head = el('button', 'sec-h', '<b>' + sec.title + '</b>' + (sec.hint ? '<small>' + sec.hint + '</small>' : '') + '<i></i>')
      const memo = 'rx_open_' + sec.title
      let open = !!sec.open
      try { const m = localStorage.getItem(memo); if (m) open = m === '1' } catch {}
      box.classList.toggle('closed', !open)
      head.addEventListener('click', () => {
        open = !open
        box.classList.toggle('closed', !open)
        try { localStorage.setItem(memo, open ? '1' : '0') } catch {}
      })
      box.append(head)
      const body = el('div', 'sec-b')
      const knobs = el('div', 'pk'), rows = el('div', 'pr'), flips = el('div', 'pf'), btns = el('div', 'pf')

        } else if (c.kind === 'choice') {

            updaters.push((s) => b.classList.toggle('now', pv(s, c.k) === o.v))
            opts.append(b)
          }
          row.append(opts)
          rows.append(row)
        } else if (c.kind === 'switch') {
          const b = el('button', 'flip', c.label)
          b.addEventListener('click', () => { send({ t: 'p', k: c.k, v: !pv(S, c.k) }); buzz() })
          updaters.push((s) => b.classList.toggle('on', !!pv(s, c.k)))

        } else if (c.kind === 'do') {

        } else if (c.kind === 'button') {

      box.append(body)

let micPc = null, micStream = null, micLock = null
const micUi = {}
function micPage() {
  const p = el('section', 'page fxp micp'); p.dataset.p = 'mic'
  const box = el('div', 'sec wide phonemic')
  box.append(el('div', 'sec-h', '<b>This phone as the mic</b><small>its microphone into the Mac, over Wi-Fi</small>'))
  micUi.status = el('div', 'pm-status', 'The Mac uses its own input now.')
  micUi.go = el('button', 'btn big pm-go', 'USE THIS PHONE AS MIC')
  micUi.go.addEventListener('click', () => (micPc ? phoneMicStop(false) : phoneMicStart()))
  micUi.secure = el('div', 'pm-secure')
  micUi.secure.hidden = true
  micUi.secure.append(
    el('p', '', 'The phone only lets a <b>secure page</b> use its microphone. Open the secure page below: the browser will warn that the connection is not private (the certificate is your Mac\'s own). Tap <b>Advanced › Proceed</b>, then tap <b>USE THIS PHONE AS MIC</b> there.'),
  )
  micUi.link = el('a', 'btn big pm-link', 'OPEN SECURE PAGE')
  micUi.secure.append(micUi.link)
  box.append(micUi.status, micUi.go, micUi.secure)
  p.append(box, el('div', 'slot'))
  updaters.push((s) => {
    const v = (k) => s.panel && s.panel.v[k]
    if (!micPc) micUi.status.textContent = v('mic.phone') ? 'Another phone is the mic now.' : v('mic.on') ? 'The Mac\'s own input is on.' : 'The Mac uses its own input now.'
    micUi.status.classList.toggle('live', !!(micPc && v('mic.phone') && v('mic.speaking')))
    if (v('mic.error') && !micPc) micUi.status.textContent = v('mic.error')
  })
  return p
}
function micStatus(text) { micUi.status.textContent = text }
async function phoneMicStart() {
  if (RELAY) return phoneMicRelay()
  if (location.protocol !== 'https:') {
    let port = 0
    try { port = (await (await fetch('/info?k=' + encodeURIComponent(KEY))).json()).securePort } catch {}
    if (!port) return micStatus('The Mac could not make a secure page. Restart RiddimX and try again.')
    micUi.link.href = 'https://' + location.hostname + ':' + port + '/?k=' + encodeURIComponent(KEY) + '&p=mic'
    micUi.secure.hidden = false
    return micStatus('One more step: open the secure page.')
  }
  if (!navigator.mediaDevices || !window.RTCPeerConnection) return micStatus('This browser cannot send its microphone. Use Chrome.')
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true } })
  } catch (e) {
    return micStatus(e && e.name === 'NotAllowedError' ? 'The microphone was not allowed. Allow it in the browser\'s site settings and try again.' : 'No microphone on this phone could be opened.')
  }
  micPc = new RTCPeerConnection({ iceServers: [] })
  for (const t of micStream.getAudioTracks()) micPc.addTrack(t, micStream)
  micPc.addEventListener('connectionstatechange', () => {
    const st = micPc && micPc.connectionState
    if (st === 'connected') { micStatus('On air path ready: this phone is the mic. TALK puts it on the speakers.'); buzz() }
    if (st === 'failed') phoneMicStop(true, 'The phone could not reach the Mac for audio. Check both are on the same network.')
  })
  micUi.go.textContent = 'STOP PHONE MIC'
  micUi.go.classList.add('on')
  micStatus('Connecting the microphone…')
  try { micLock = await navigator.wakeLock.request('screen') } catch {}
  await micPc.setLocalDescription(await micPc.createOffer())
  await new Promise((done) => {
    if (micPc.iceGatheringState === 'complete') return done()
    const t = setTimeout(done, 1000)
    micPc.addEventListener('icegatheringstatechange', () => { if (micPc && micPc.iceGatheringState === 'complete') { clearTimeout(t); done() } })
  })
  if (micPc) send({ t: 'rtc', sdp: micPc.localDescription.sdp })
}
function phoneMicAnswer(m) {
  if (!micPc) return
  if (m.t === 'rtc-fail' || !m.sdp) return phoneMicStop(true, 'The Mac did not take the call. Try again.')
  micPc.setRemoteDescription({ type: 'answer', sdp: m.sdp }).catch(() => phoneMicStop(true, 'The Mac did not take the call. Try again.'))
}
// Through the RiddimX server: the microphone goes up as a track; the Mac picks it up from there.
async function phoneMicRelay() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true } })
  } catch (e) {
    return micStatus(e && e.name === 'NotAllowedError' ? 'The microphone was not allowed. Allow it in the browser\'s site settings and try again.' : 'No microphone on this phone could be opened.')
  }
  micUi.go.textContent = 'STOP PHONE MIC'
  micUi.go.classList.add('on')
  micStatus('Connecting the microphone…')
  try { micLock = await navigator.wakeLock.request('screen') } catch {}
  try {
    await ws.publishMic(micStream)
    micPc = { close: () => ws && ws.unpublishMic && ws.unpublishMic() } // so the rest treats it as on
    micStatus('On air path ready: this phone is the mic. TALK puts it on the speakers.'); buzz()
  } catch (e) { phoneMicStop(true, 'The microphone could not reach the Mac. Try again.') }
}
function phoneMicStop(quiet, why) {
  if (!quiet && !RELAY) send({ t: 'rtc-stop' })
  if (micPc) micPc.close()
  if (micStream) micStream.getTracks().forEach((t) => t.stop())
  if (micLock) micLock.release().catch(() => {})
  micPc = null; micStream = null; micLock = null
  micUi.go.textContent = 'USE THIS PHONE AS MIC'
  micUi.go.classList.remove('on')
  micStatus(why || 'Phone mic off: the Mac uses its own input again.')
}

// ───────── pages ─────────
const main = document.getElementById('main'), dot = document.getElementById('dot'), off = document.getElementById('off')
main.append(deckPage('A'), deckPage('B'), mixPage(), dubPage(), fxPage(), micPage())
const tabs = document.querySelectorAll('.tab')
function show(id) {
  for (const t of tabs) t.classList.toggle('now', t.dataset.p === id)
  for (const pg of main.children) pg.classList.toggle('now', pg.dataset.p === id)
  try { localStorage.setItem('rx_page', id) } catch {}
}
for (const t of tabs) t.addEventListener('click', () => show(t.dataset.p))
let first = new URLSearchParams(location.search).get('p') || ''
try { if (!first) first = localStorage.getItem('rx_page') || 'A' } catch {}
if (!main.querySelector('.page[data-p="' + first + '"]')) first = 'A'
show(first)
document.getElementById('fs').addEventListener('click', () => {
  const de = document.documentElement
  if (document.fullscreenElement) document.exitFullscreen()
  else if (de.requestFullscreen) de.requestFullscreen().catch(() => {})
  else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen()
})
document.addEventListener('gesturestart', (e) => e.preventDefault()) // no pinch zoom on iOS
connect()
</script>
