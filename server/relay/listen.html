<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>RiddimX LIVE</title>
<style>
  :root { --bg: #0e0d0a; --panel: #161410; --line: #2c281f; --text: #ece6d8; --dim: #958c7a; --on: #f2c230; --hot: #e5484d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: grid; place-items: center; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  main { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); padding: 24px 20px; display: grid; gap: 18px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: 0.02em; display: flex; align-items: center; gap: 10px; }
  h1 small { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: var(--dim); border: 1px solid var(--line); padding: 2px 6px; }
  h1 small.on { color: #1a1608; background: var(--on); border-color: var(--on); }
  #now { min-height: 2.8em; color: var(--dim); font-size: 13px; }
  #now b { display: block; color: var(--text); font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; font-weight: 800; letter-spacing: 0.1em; border-radius: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #play { height: 64px; width: 100%; border: 1px solid var(--line); background: #1e1b15; color: var(--text); font-size: 16px; transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1); }
  #play:active { transform: scale(0.97); }
  #play.on { background: var(--on); border-color: var(--on); color: #1a1608; }
  #play:disabled { opacity: 0.5; }
  .row { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 12px; }
  input[type=range] { flex: 1; accent-color: var(--on); }
  #status { font-size: 12px; color: var(--dim); min-height: 1.4em; }
  #status.err { color: #ff8a7a; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; }
  .dot.on { background: var(--hot); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .dot.on { animation: none; } }
  footer { font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1><span class="dot" id="dot"></span>RiddimX <small id="badge">LIVE</small></h1>
  <div id="now">Live mix, straight from the DJ's decks.</div>
  <button id="play" type="button">LISTEN</button>
  <div class="row"><span>VOL</span><input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <footer><span id="count"></span></footer>
</main>
<audio id="out" playsinline></audio>
<script src="/livekit-client.umd.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search)
  const code = q.get('k')
  const $ = (id) => document.getElementById(id)
  const play = $('play'), status = $('status'), out = $('out'), dot = $('dot'), badge = $('badge')
  const LK = window.LivekitClient
  let want = false, room = null
  const say = (text, err) => { status.textContent = text; status.classList.toggle('err', !!err) }
  if (!code) {
    play.disabled = true
    say(q.get('g') ? 'This is a co-DJ invite: open RiddimX and paste it in JOIN.' : 'This link is incomplete.', true)
    return
  }
  if (!LK) { play.disabled = true; say('Could not load the player.', true); return }

  $('vol').addEventListener('input', (e) => { out.volume = Number(e.target.value) })
  const setPlay = () => { play.textContent = want ? 'STOP' : 'LISTEN'; play.classList.toggle('on', want); play.setAttribute('aria-pressed', String(want)) }
  const onAir = (on) => { dot.classList.toggle('on', on); badge.classList.toggle('on', on) }
  const count = () => {
    if (!room) return
    const n = [...room.remoteParticipants.values()].filter((p) => p.identity.startsWith('l-')).length + 1
    $('count').textContent = n === 1 ? '1 listening' : n + ' listening'
  }
  function now(m) {
    const box = $('now')
    if (!m.title) { box.textContent = "Live mix, straight from the DJ's decks."; return }
    box.innerHTML = '<b></b><span></span>'
    box.querySelector('b').textContent = m.title
    box.querySelector('span').textContent = m.artist || ''
  }

  async function connect() {
    say('Connecting…')
    let t
    try {
      const r = await fetch('/api/token?k=' + encodeURIComponent(code), { cache: 'no-store' })
      t = await r.json()
      if (!r.ok) throw new Error(t.error || 'not on air')
    } catch (e) {
      want = false; setPlay(); say(e.message === 'Failed to fetch' ? 'Could not reach the server.' : 'The DJ is not on air right now.', true); return
    }
    room = new LK.Room({ adaptiveStream: false, dynacast: false })
    room.on(LK.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind !== 'audio') return
      // As little buffering as the network allows.
      try { track.receiver.jitterBufferTarget = 0; track.receiver.playoutDelayHint = 0 } catch (e) {}
      out.srcObject = new MediaStream([track.mediaStreamTrack])
      out.play().then(() => { say('On air.'); onAir(true) }, () => say('Tap LISTEN again to start the sound.', true))
    })
    room.on(LK.RoomEvent.TrackUnsubscribed, () => { if (!want) return; onAir(false); say('Waiting for the DJ…') })
    room.on(LK.RoomEvent.ParticipantConnected, count)
    room.on(LK.RoomEvent.ParticipantDisconnected, (p) => { count(); if (p.identity === 'host' && want) { onAir(false); out.srcObject = null; say('The DJ is off air. Waiting…') } })
    room.on(LK.RoomEvent.DataReceived, (payload) => {
      let m; try { m = JSON.parse(new TextDecoder().decode(payload)) } catch { return }
      if (m.t === 'now') now(m)
      if (m.t === 'off') { want = false; setPlay(); stop(); say('The DJ ended the live set.') }
    })
    room.on(LK.RoomEvent.Reconnecting, () => say('Reconnecting…', true))
    room.on(LK.RoomEvent.Reconnected, () => say('On air.'))
    room.on(LK.RoomEvent.Disconnected, () => { onAir(false); if (want) { want = false; setPlay(); say('Disconnected. Tap LISTEN to try again.', true) } })
    try {
      await room.connect(t.ws, t.token, { autoSubscribe: true })
      count()
      if (!out.srcObject) say('Waiting for the DJ…')
    } catch (e) { want = false; setPlay(); say('Could not connect: ' + (e.message || e), true) }
  }
  function stop() { if (room) { const r = room; room = null; r.disconnect() } out.srcObject = null; onAir(false) }

  play.addEventListener('click', () => {
    want = !want
    setPlay()
    if (want) { out.play().catch(() => undefined); connect() } else { stop(); say('') }
  })
})()
</script>
</body>
</html>
